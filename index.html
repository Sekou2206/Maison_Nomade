<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="LA MAISON NOMADE — Abidjan. Marque de vêtements inspirée de l'héritage africain. Bienvenue chez les Nomades.">
<title>LA MAISON NOMADE — ABIDJAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ================= TOKENS ================= */
:root{
  --noir:#1A1A1A; --blanc:#FFFFFF;
  --gris-carte:#EAEAEA; --gris-bord:#E4E4E4; --gris-txt:#8A8A8A; --gris-clair:#C6C6C6;
  --marge-g:5.7vw; --marge-d:5.6vw;
  --hdr-h:clamp(56px,7.1vw,84px);
  --font-titre:'Syncopate',sans-serif;
  --font-txt:'Inter',sans-serif;
  --hero-text:#FFFFFF;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{overflow-x:hidden}
body{font-family:var(--font-txt);color:var(--noir);background:var(--blanc);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
ul{list-style:none}
button{font-family:inherit;background:none;border:none;cursor:pointer;color:inherit}
img{display:block}
a,button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--noir);outline-offset:3px}
main{padding-top:var(--hdr-h)}
.skip{position:fixed;top:-52px;left:12px;background:var(--noir);color:#fff;padding:10px 18px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;z-index:500;transition:top .3s}
.skip:focus{top:0}

/* ================= BOUTONS PILULE ================= */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:.6em;border-radius:9999px;font-family:var(--font-txt);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:clamp(10px,1.5vw,14px);cursor:pointer;transition:background .3s,color .3s,border-color .3s;white-space:nowrap}
.pill-solid{background:var(--noir);color:#fff;border:1px solid var(--noir)}
.pill-solid:hover{background:#000}
.pill-outline{background:var(--blanc);color:var(--noir);border:1px solid var(--noir)}
.pill-outline:hover{background:var(--noir);color:#fff}
.pill-lg{width:16.8vw;min-width:120px;height:7.1vw;min-height:51px}
.pill svg{width:1.2em;height:1.2em;flex:none}

/* ================= HEADER ================= */
.hdr{position:fixed;top:0;left:0;right:0;height:var(--hdr-h);background:var(--blanc);border-bottom:1px solid var(--gris-bord);z-index:100;display:flex;align-items:center}
.hdr-logo{position:absolute;left:var(--marge-g);top:50%;transform:translateY(-50%);font-family:var(--font-titre);font-weight:700;font-size:clamp(14px,1.9vw,24px);letter-spacing:.02em;line-height:1;z-index:2}
.hdr-nav{position:absolute;left:31vw;top:0;height:100%;width:38vw;display:flex}
.nav-cell{width:9vw;height:100%;display:flex;align-items:center;justify-content:center;font-size:clamp(9px,1.1vw,13px);letter-spacing:.04em;text-transform:uppercase;border-left:1px solid var(--gris-bord);position:relative}
.nav-cell:last-child{border-right:1px solid var(--gris-bord);flex:1}
.nav-link{position:relative;display:flex;align-items:center;gap:.35vw;height:100%}
.nav-link::after{content:"";position:absolute;left:0;right:0;bottom:calc(50% - 1.5em);height:1px;background:var(--noir);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.nav-cell:hover .nav-link::after,.nav-drop.open .nav-link::after{transform:scaleX(1)}
.nav-drop-btn{width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:.4vw;font-size:clamp(9px,1.1vw,13px);letter-spacing:.04em;text-transform:uppercase}
.nav-drop-btn svg{width:clamp(7px,.7vw,10px);transition:transform .3s}
.nav-drop:hover .nav-drop-btn svg,.nav-drop.open .nav-drop-btn svg{transform:rotate(180deg)}
.drop{position:absolute;top:100%;left:0;width:100%;background:var(--blanc);border:1px solid var(--gris-bord);border-top:none;display:none;flex-direction:column;z-index:5}
.nav-drop:hover .drop,.nav-drop.open .drop{display:flex}
.drop a{padding:.95em 1em;font-size:clamp(9px,.95vw,12px);letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--gris-bord);transition:background .3s}
.drop a:last-child{border-bottom:none}
.drop a:hover{background:#F5F5F5}
.hdr-search{position:absolute;left:77vw;top:0;height:100%;display:flex;align-items:center;gap:.7vw}
.hdr-search>svg{width:clamp(14px,1.6vw,22px);flex:none;cursor:pointer}
.hdr-search input{width:11vw;min-width:80px;border:none;background:transparent;font-family:var(--font-txt);font-size:clamp(8px,.85vw,11px);letter-spacing:.03em;color:var(--noir)}
.hdr-search input::placeholder{color:var(--gris-clair)}
.hdr-search input:focus{outline:none}
.hdr-vsep{position:absolute;left:88.1vw;top:0;width:1px;height:100%;background:var(--gris-bord)}
.hdr-heart{position:absolute;left:89vw;top:0;height:100%;display:flex;align-items:center}
.hdr-heart svg{width:clamp(16px,1.8vw,26px)}
.hdr-heart .dot{position:absolute;top:calc(50% - 1.35vw);right:calc(50% - 1.55vw);width:6px;height:6px;border-radius:50%;background:var(--noir);opacity:0;transition:opacity .3s}
.hdr-heart.has .dot{opacity:1}
.hdr-cart{position:absolute;right:0;top:0;height:100%;width:clamp(48px,7vw,84px);background:var(--noir);color:#fff;display:flex;align-items:center;justify-content:center;transition:background .3s}
.hdr-cart:hover{background:#000}
.hdr-cart:focus-visible{outline:2px solid var(--blanc);outline-offset:-6px}
.hdr-cart svg{width:clamp(18px,2vw,28px)}
.cart-ic{position:relative;display:flex}
.cart-count{position:absolute;top:-5px;right:-8px;min-width:15px;height:15px;padding:0 4px;border-radius:9999px;background:#fff;color:var(--noir);font-size:9px;font-weight:600;display:none;align-items:center;justify-content:center}
.cart-count.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.3)}}
.hdr-burger{display:none}
@media(max-width:899px){.hdr-search{cursor:pointer}.hdr-search>svg{width:19px}}
@media(max-width:639px){
  .hdr-nav,.hdr-vsep{display:none}
  .hdr-burger{display:flex;align-items:center;margin-left:4.5vw}
  .hdr-burger svg{width:22px}
  .hdr-logo{position:static;transform:none;margin-left:5vw;flex:1}
  .hdr-search{position:static;margin-right:5vw;height:auto}
  .hdr-heart{position:static;margin-right:5vw;height:auto}
  .hdr-heart .dot{top:-2px;right:-6px}
  .hdr-cart{position:static;width:clamp(48px,13vw,60px)}
}

/* ================= HÉROS ================= */
.hero{position:relative;width:100%;height:57.6vw;min-height:70vh;max-height:100vh;background:var(--gris-carte);overflow:hidden;color:var(--hero-text)}
.hero-poster,.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 50%}
.hero-shade{position:absolute;inset:0;background:rgba(0,0,0,.2)}
.hero-title{position:absolute;top:49%;left:0;width:100%;font-family:var(--font-titre);font-weight:700;font-size:clamp(32px,7vw,110px);line-height:1.05;text-transform:uppercase}
.hero-title .l1{display:block;padding-left:8.8vw}
.hero-title .l2{display:block;padding-left:5.7vw}
.hero-sub{position:absolute;top:76%;left:var(--marge-g);font-size:clamp(10px,1.25vw,15px);line-height:1.3;letter-spacing:.04em;font-weight:400}
.hero-cta{position:absolute;top:68%;right:var(--marge-d)}
@media(max-width:639px){
  /* Héros plein écran sur mobile : il occupe TOUT l'écran sous le header,
     la section suivante n'est jamais visible en même temps */
  .hero{height:calc(100vh - var(--hdr-h));height:calc(100svh - var(--hdr-h));min-height:480px;max-height:none}
  .hero-title{font-size:13vw;top:40%}
  .hero-title .l1{padding-left:10vw}
  .hero-sub{top:auto;bottom:25vw;font-size:11px;line-height:1.45}
  .hero-cta{top:auto;bottom:8vw;right:auto;left:50%;transform:translateX(-50%);width:72vw;height:12.5vw;min-height:48px}
}

/* ================= CATÉGORIES ================= */
.cats{position:relative;display:grid;grid-template-columns:1fr 1fr;height:57.3vw}
.cat{position:relative;overflow:hidden;background:#DBDBDB}
.cat-right{background:#E2E2E2}
.cat img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.cat:hover img{transform:scale(1.03)}
.cat-cover{position:absolute;inset:0;z-index:1}
.cat-list{position:absolute;top:4.3vw;left:var(--marge-g);z-index:2;color:#fff;font-size:clamp(9px,1.3vw,13px);line-height:2.2vw;letter-spacing:.08em;text-transform:uppercase;font-weight:400}
.cat-list a{opacity:.9;transition:opacity .3s}
.cat-list a:hover{opacity:1;text-decoration:underline;text-underline-offset:3px}
.cat-list .strong{font-weight:700;opacity:1}
.cat-list-right{left:auto;right:var(--marge-d);text-align:right;opacity:.7}
.cats-title{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);z-index:3;text-align:center;color:#fff;pointer-events:none}
.cats-title h2{font-family:var(--font-titre);font-weight:700;font-size:clamp(18px,3.8vw,56px);line-height:1.05;text-transform:uppercase;white-space:nowrap}
.cats-title span{display:block;margin-top:clamp(12px,3.6vw,44px);font-size:clamp(8px,.9vw,11px);letter-spacing:.2em;font-weight:400}
@media(max-width:639px){
  .cats{display:block;height:auto}
  .cat{height:58vh}
  .cat img{transform:scale(1.02)}
  .cat-list{top:5.5vw;line-height:2.2em;font-size:10px}
  .cats-title{top:58vh;width:94vw}
  .cats-title h2{white-space:normal;font-size:clamp(20px,8.2vw,34px)}
  .cats-title span{margin-top:4.5vw}
}

/* ================= BEST-SELLERS ================= */
.bs{padding-bottom:clamp(48px,7vw,110px)}
.bs-head{height:19.4vw;padding:0 var(--marge-d) 0 var(--marge-g);display:flex;align-items:center;justify-content:space-between;gap:3vw}
.bs-head h2{font-family:var(--font-titre);font-weight:700;font-size:clamp(20px,3.9vw,56px);line-height:1.05;text-transform:uppercase}
.bs-wrap{position:relative;margin-top:3.6vw}
.bs-track{display:flex;gap:.7vw;margin:0 var(--marge-d) 0 var(--marge-g);overflow-x:auto;scrollbar-width:none}
.bs-track::-webkit-scrollbar{display:none}
.pcard{flex:0 0 21.7vw;display:block}
/* L'image du produit REMPLIT TOUT LE CADRE (100% × 100%, cover) */
.pcard-img{height:32.2vw;background:var(--gris-carte);overflow:hidden}
.pcard-img img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.pcard:hover .pcard-img img{transform:scale(1.04)}
.pcard-meta{margin-top:1.9vw;display:flex;justify-content:space-between;gap:1em;font-size:clamp(9px,1.25vw,13px);letter-spacing:.04em}
.pcard-name{font-weight:700;text-transform:uppercase}
.pcard-price{font-weight:400;text-align:right}
.bs-arrow{position:absolute;top:16.1vw;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;transition:opacity .3s;z-index:2}
.bs-arrow svg{width:clamp(18px,1.4vw,24px);height:clamp(28px,2.2vw,38px)}
.bs-prev{left:2.8vw}
.bs-next{right:3.2vw}
.bs-arrow.dim{opacity:.22;pointer-events:none}
@media(max-width:639px){
  .bs-head{height:auto;padding-top:14vw;flex-direction:column;align-items:flex-start;gap:5.5vw}
  .bs-head h2{font-size:clamp(24px,8.5vw,40px)}
  .bs-head .pill{width:52vw;min-width:0;height:12vw;min-height:46px}
  .bs-wrap{margin-top:7vw}
  .bs-track{gap:2.5vw;scroll-snap-type:x mandatory}
  .pcard{flex:0 0 44vw;scroll-snap-align:start}
  .pcard-img{height:auto;aspect-ratio:2/3}
  .pcard-meta{font-size:10.5px;margin-top:3vw;gap:.6em}
  .bs-arrow{display:none}
}

/* ================= GRILLE CATALOGUE & PAGES ================= */
.page{padding:clamp(24px,3.5vw,64px) var(--marge-d) clamp(48px,6.5vw,110px) var(--marge-g)}
.crumb{font-size:clamp(9px,.95vw,12px);letter-spacing:.14em;text-transform:uppercase;color:var(--gris-txt);margin-bottom:clamp(10px,1.4vw,24px)}
.crumb a:hover{text-decoration:underline}
.chead h1{font-family:var(--font-titre);font-weight:700;font-size:clamp(26px,4.5vw,72px);line-height:1.05;text-transform:uppercase}
.chead-row{display:flex;justify-content:space-between;align-items:flex-end;gap:3vw;flex-wrap:wrap;margin-top:clamp(16px,2.4vw,40px)}
.tabs,.sorter{display:flex;gap:clamp(14px,2vw,32px)}
.tab{font-size:clamp(10px,1.05vw,13px);letter-spacing:.04em;text-transform:uppercase;color:var(--gris-txt);padding:6px 0 5px;border-bottom:1px solid transparent;transition:color .3s,border-color .3s}
.tab:hover{color:var(--noir)}
.tab.on{color:var(--noir);border-color:var(--noir)}
.qchip{display:inline-flex;align-items:center;gap:10px;margin-top:clamp(12px,1.6vw,26px);font-size:clamp(9px,.95vw,12px);letter-spacing:.06em;text-transform:uppercase;color:var(--gris-txt)}
.qchip button{display:flex}
.qchip svg{width:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.7vw;margin-top:clamp(24px,3.4vw,56px)}
.grid .pcard{flex:none}
.grid .pcard-img{height:auto;aspect-ratio:2/3}
.gempty{grid-column:1/-1;padding:8vw 0;text-align:center;color:var(--gris-txt);font-size:clamp(10px,1vw,13px);letter-spacing:.08em;text-transform:uppercase}
@media(max-width:639px){
  .grid{grid-template-columns:repeat(2,1fr);gap:3vw}
  .grid .pcard-meta{font-size:10px;margin-top:2.5vw}
  .chead-row{align-items:flex-start;flex-direction:column;gap:4.5vw}
  .page{padding-top:8vw}
}

/* ================= PAGE PRODUIT ================= */
.pdp{display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(24px,4.5vw,80px);padding:clamp(20px,3vw,48px) var(--marge-d) clamp(48px,6vw,100px) var(--marge-g)}
/* Grande photo = elle occupe tout son cadre */
.pdp-main{background:var(--gris-carte);aspect-ratio:3/4;overflow:hidden}
.pdp-main img{width:100%;height:100%;object-fit:cover}
.pdp-main video{width:100%;height:100%;object-fit:cover}
.pdp-thumbs{display:flex;gap:.7vw;margin-top:.7vw}
.pdp-thumb{width:clamp(56px,7vw,96px);aspect-ratio:1;background:var(--gris-carte);position:relative;border:1px solid transparent;transition:border-color .3s;padding:0;overflow:hidden}
.pdp-thumb.active{border-color:var(--noir)}
.pdp-thumb img{width:100%;height:100%;object-fit:cover}
.pdp-thumb .tplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.35)}
.pdp-thumb .tplay svg{width:22px;color:var(--noir)}
.pdp-titlerow{display:flex;align-items:flex-start;justify-content:space-between;gap:2vw}
.pdp-info h1{font-family:var(--font-titre);font-weight:700;font-size:clamp(24px,2.8vw,46px);line-height:1.05;text-transform:uppercase}
.pdp-fav{margin-top:.4em}
.pdp-fav svg{width:clamp(22px,1.9vw,28px)}
.pdp-fav.has svg{fill:var(--noir)}
.pdp-price{margin-top:1.2em;font-size:clamp(12px,1.4vw,18px);letter-spacing:.04em}
.pdp-desc{margin-top:1.6em;color:var(--gris-txt);font-size:clamp(11px,1.15vw,14px);line-height:1.75;max-width:56ch}
.pdp-label{margin-top:2.4em;font-size:clamp(9px,.95vw,12px);letter-spacing:.14em;color:var(--gris-txt);text-transform:uppercase}
.pdp-sizes{display:flex;gap:.7vw;margin-top:1em;flex-wrap:wrap}
.size{min-width:clamp(44px,3.4vw,54px);height:clamp(44px,3.4vw,54px);display:flex;align-items:center;justify-content:center;border:1px solid #D8D8D8;font-size:clamp(10px,1.05vw,13px);letter-spacing:.04em;transition:background .3s,color .3s,border-color .3s}
.size:hover{border-color:var(--noir)}
.size.sel{background:var(--noir);color:#fff;border-color:var(--noir)}
.pdp-row{display:flex;gap:1vw;margin-top:2.2em;align-items:stretch;flex-wrap:wrap}
.qty{display:flex;align-items:center;border:1px solid var(--gris-bord)}
.qty button{width:clamp(44px,3.2vw,50px);height:clamp(51px,5vw,72px);font-size:16px}
.qty span{min-width:2.4em;text-align:center;font-size:clamp(11px,1.05vw,13px)}
.pdp-add{flex:1;height:clamp(51px,7.1vw,92px)}
.pdp-note{margin-top:1.6em;font-size:clamp(9px,.95vw,12px);color:var(--gris-txt);letter-spacing:.04em;text-transform:uppercase}
.pdp-note a{text-decoration:underline;text-underline-offset:3px}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.25}}
.flash{animation:flash .55s ease 1}
/* Barre d'achat fixe — mobile uniquement */
.pdp-bar{display:none}
@media(max-width:639px){
  .pdp{grid-template-columns:1fr;gap:7vw;padding-bottom:30vw}
  .pdp-main{aspect-ratio:4/5}
  .pdp-thumbs{gap:2vw}
  .pdp-thumb{width:17vw}
  .pdp-desc{font-size:12.5px}
  .pdp-add{width:100%;flex:none;height:12.5vw;min-height:48px}
  .pdp-bar{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--blanc);border-top:1px solid var(--gris-bord);display:flex;align-items:center;gap:3vw;padding:3vw 4vw calc(3vw + env(safe-area-inset-bottom,0px))}
  .pdp-bar-price{font-size:13px;font-weight:600;letter-spacing:.03em;white-space:nowrap}
  .pdp-bar .pill{flex:1;height:12.5vw;min-height:46px;font-size:11px}
}

/* ================= PAGES ÉDITORIALES ================= */
.brand-giant{font-family:var(--font-titre);font-weight:700;font-size:clamp(26px,5.6vw,96px);line-height:1.05;text-transform:uppercase}
.brand-lede{margin-top:clamp(20px,2.6vw,44px);font-size:clamp(12px,1.35vw,17px);line-height:1.75;max-width:62ch}
.brand-lede strong{font-weight:600}
.brand-lines{margin-top:clamp(36px,4.5vw,80px)}
.bline{display:grid;grid-template-columns:8vw 22vw 1fr;gap:2vw;padding:clamp(20px,2.6vw,44px) 0;border-top:1px solid var(--gris-bord);align-items:baseline}
.bnum{font-size:clamp(10px,1.05vw,13px);color:var(--gris-txt);letter-spacing:.1em}
.bline h3{font-family:var(--font-titre);font-weight:700;font-size:clamp(15px,1.8vw,28px);text-transform:uppercase;line-height:1.1}
.bline p{color:var(--gris-txt);font-size:clamp(11px,1.1vw,14px);line-height:1.75;max-width:60ch}
.brand-cta{margin-top:clamp(36px,4.5vw,80px)}
@media(max-width:639px){
  .bline{grid-template-columns:14vw 1fr;grid-template-rows:auto auto}
  .bline p{grid-column:2}
}
.contact-list{margin-top:clamp(24px,3vw,52px);display:flex;gap:clamp(24px,6vw,110px);flex-wrap:wrap}
.contact-list .fcol a{display:flex;align-items:center;gap:.7em}
.contact-list svg{width:15px}
.page .pill-lg{margin-top:clamp(28px,3.5vw,60px);width:auto;padding:0 2.6em;height:clamp(51px,5.4vw,72px)}
.ttable{margin-top:1.6em;border-collapse:collapse;max-width:560px;width:100%}
.ttable th,.ttable td{border:1px solid var(--gris-bord);padding:.9em 1.2em;font-size:clamp(10px,1vw,13px);letter-spacing:.04em;text-align:left}
.ttable th{text-transform:uppercase;letter-spacing:.1em;color:var(--gris-txt);font-weight:500}
.tnote{margin-top:1.4em;color:var(--gris-txt);font-size:clamp(10px,1vw,13px)}
.svc-body p{margin-top:1.2em;font-size:clamp(12px,1.25vw,15px);line-height:1.75;max-width:62ch}

/* ================= TIROIRS / OVERLAYS ================= */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:190}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,94vw);background:var(--blanc);border-left:1px solid var(--gris-bord);z-index:200;transform:translateX(102%);transition:transform .35s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--gris-bord)}
.drawer-head h2{font-family:var(--font-titre);font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase}
.drawer-body{flex:1;overflow-y:auto;padding:4px 24px;overscroll-behavior:contain}
.drawer-foot{border-top:1px solid var(--gris-bord);padding:20px 24px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.d-total{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.d-wa{width:100%;height:54px}
.d-note{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--gris-txt);text-align:center}
.citem{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--gris-bord)}
/* Vignettes panier/favoris : l'image remplit tout le cadre */
.citem-img{width:72px;height:88px;background:var(--gris-carte);flex:none;overflow:hidden}
.citem-img img{width:100%;height:100%;object-fit:cover}
.citem-info{flex:1;min-width:0}
.citem-name{font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.citem-size{font-size:10px;color:var(--gris-txt);margin-top:5px;letter-spacing:.04em}
.citem-qty{display:inline-flex;align-items:center;border:1px solid var(--gris-bord);margin-top:10px}
.citem-qty button{width:30px;height:30px;font-size:13px}
.citem-qty span{min-width:30px;text-align:center;font-size:11px}
.citem-right{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;flex:none}
.citem-price{font-size:11px;white-space:nowrap;margin-bottom:6px}
.citem-del{display:flex;color:var(--gris-txt);transition:color .3s}
.citem-del:hover{color:var(--noir)}
.citem-del svg{width:14px}
.empty{padding:48px 0;text-align:center;color:var(--gris-txt);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.fav-hint{padding:24px 0;color:var(--gris-txt);font-size:10px;letter-spacing:.06em;text-transform:uppercase}

/* Recherche plein écran */
.srch{position:fixed;inset:0;background:var(--blanc);z-index:220;transform:translateY(-102%);transition:transform .35s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.srch.open{transform:none}
.srch-head{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(16px,4vw,40px);border-bottom:1px solid var(--gris-bord);height:var(--hdr-h)}
.srch-logo{font-family:var(--font-titre);font-weight:700;font-size:clamp(14px,1.9vw,22px)}
.srch-box{margin:clamp(24px,6vh,60px) clamp(16px,10vw,220px) 0;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--noir);padding-bottom:14px}
.srch-box svg{width:20px;flex:none}
.srch-box input{flex:1;border:none;font-family:var(--font-txt);font-size:clamp(16px,3.5vw,22px);text-transform:uppercase;letter-spacing:.04em}
.srch-box input:focus{outline:none}
.srch-res{margin:0 clamp(16px,10vw,220px);overflow-y:auto;padding-bottom:40px}
.srch-hint{padding:22px 0;color:var(--gris-txt);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.sres{display:flex;justify-content:space-between;gap:2em;padding:15px 0;border-bottom:1px solid var(--gris-bord);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.sres:hover{color:var(--gris-txt)}
.sres-price{color:var(--gris-txt)}

/* Menu mobile */
.mmenu{position:fixed;inset:0;background:var(--blanc);z-index:240;transform:translateX(-102%);transition:transform .35s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.mmenu.open{transform:none}
.mmenu-head{display:flex;align-items:center;justify-content:space-between;padding:18px 4.5vw;height:var(--hdr-h);border-bottom:1px solid var(--gris-bord)}
.mmenu-logo{font-family:var(--font-titre);font-weight:700;font-size:15px}
.mmenu-links{flex:1;overflow-y:auto;padding:3vh 4.5vw}
.mmenu-links a{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-titre);font-weight:700;font-size:clamp(20px,6.5vw,30px);text-transform:uppercase;line-height:1.05;padding:3.2vh 0;border-bottom:1px solid var(--gris-bord)}
.mmenu-links a svg{width:18px;color:var(--gris-txt)}
.mmenu-foot{padding:3.5vh 4.5vw calc(3.5vh + env(safe-area-inset-bottom,0px));font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--gris-txt);line-height:2;border-top:1px solid var(--gris-bord)}

/* Toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);background:var(--noir);color:#fff;padding:13px 24px;border-radius:9999px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:300;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:639px){.toast{bottom:24vw}}

/* Révélation au scroll */
.reveal{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}

/* ================= FOOTER — GRAND, PRO, LUXE ================= */
.footer{border-top:1px solid var(--gris-bord);padding:clamp(48px,6.5vw,120px) var(--marge-d) 0 var(--marge-g)}
.footer-top{display:grid;grid-template-columns:1.35fr 2fr;gap:clamp(32px,5vw,90px);padding-bottom:clamp(48px,6vw,100px)}

.footer-social{display:flex;gap:.9vw;margin-top:2.4em}

.footer-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:2.5vw}

.fcol p,.fcol a{display:block;font-size:clamp(11px,1.05vw,14px);letter-spacing:.05em;line-height:2.4;text-transform:uppercase}

.fcol svg{width:14px;display:inline-block;vertical-align:-2px;margin-right:.5em}
.fcol .faddr{color:var(--gris-txt);line-height:2}
/* Mot géant : les lettres s'écartent pour remplir TOUTE la largeur */
.footer-word{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--gris-bord);padding-top:clamp(14px,1.8vw,30px);font-family:var(--font-titre);font-weight:700;font-size:clamp(26px,8.6vw,150px);line-height:1;user-select:none;letter-spacing:-.01em}

@media(min-width:640px) and (max-width:1023px){

  .footer-word{font-size:11.5vw;padding-top:5vw}
}

<body>
<div id="app"></div>

<script>

================================================================ */

/* ============ 3. ÉTAT + STOCKAGE ============ */
const store = { cart:load("lmn_cart_v1",[]), favs:load("lmn_favs_v1",[]) };
const state = { ui:{} };
let pdpState = { size:null, qty:1 }, currentSlug = null, toastTimer = null;

function load(k,fb){ try{ return JSON.parse(localStorage.getItem(k)) ?? fb; }catch(e){ return fb; } }
function persist(){ try{ localStorage.setItem("lmn_cart_v1",JSON.stringify(store.cart)); localStorage.setItem("lmn_favs_v1",JSON.stringify(store.favs)); }catch(e){} }

/* Petits utilitaires */
const qs=(s,r=document)=>r.querySelector(s), qsA=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,"\u00A0");
const bySlug=s=>PRODUCTS.find(p=>p.slug===s);
const byCat=c=>PRODUCTS.filter(p=>p.category===c);
const cartCount=()=>store.cart.reduce((s,i)=>s+i.qty,0);
const cartTotal=()=>store.cart.reduce((s,i)=>s+bySlug(i.slug).price*i.qty,0);

/* Images manquantes → le fond gris du conteneur reste visible, jamais d'icône cassée.
   Vidéo manquante → on cache la <video>, l'image poster placée derrière prend le relais. */
document.addEventListener("error",e=>{ const t=e.target; if(t.tagName==="IMG"||t.tagName==="VIDEO") t.style.display="none"; },true);

/* ============ 6. ROUTEUR + INTERACTIONS ============ */
function parseHash(){
  const h=location.hash.replace(/^#/,"")||"/";
  const [pathStr,queryStr]=h.split("?");
  const parts=pathStr.split("/").filter(Boolean);
  return { parts, params:new URLSearchParams(queryStr||"") };
}

function routeView(parts,params){
  const [a,b]=parts;
  if(!a) return { html:HomePage(), title:"Accueil" };
  if(a==="catalogue"&&!b) return { html:CataloguePage("all",params), title:"Catalogue" };
  if(a==="catalogue"&&(b==="t-shirts"||b==="ensembles")) return { html:CataloguePage(b,params), title:b==="t-shirts"?"T-shirts":"Ensembles" };
  if(a==="produit"&&b) return { html:ProductPage(b), title:bySlug(b)?bySlug(b).name:"Produit" };
  if(a==="la-marque") return { html:BrandPage(), title:"La marque" };
  if(a==="service"&&b) return { html:ServicePage(b), title:INFO[b]?INFO[b].t:"Service" };
  if(a==="contact") return { html:ContactPage(), title:"Contact" };
  return { html:NotFoundPage(), title:"Introuvable" };
}

let io=null;
function observeReveals(){
  if(io) io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }),{threshold:.12});
  qsA(".reveal").forEach(el=>io.observe(el));
}

function toast(msg){
  const t=qs("#toast"); if(!t) return;
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2400);
}

function updateBadges(){
  const cc=qs(".cart-count");
  if(cc){ const n=cartCount(); cc.textContent=n; cc.style.display=n?"flex":"none";
    cc.classList.remove("pop"); void cc.offsetWidth; if(n) cc.classList.add("pop"); }
  qs(".hdr-heart")?.classList.toggle("has",store.favs.length>0);
}

function addToCart(slug,size,qty){
  const ex=store.cart.find(i=>i.slug===slug&&i.size===size);
  if(ex) ex.qty=Math.min(99,ex.qty+qty); else store.cart.push({slug,size,qty});
  persist(); renderOverlays(); updateBadges();
  toast(`Ajouté au panier — ${bySlug(slug).name} (${size})`);
}
function toggleFav(slug){
  const i=store.favs.indexOf(slug);
  if(i>=0){ store.favs.splice(i,1); toast("Retiré des favoris"); }
  else { store.favs.push(slug); toast("Ajouté aux favoris"); }
  persist(); updateBadges();
  const fb=qs(".pdp-fav"); if(fb){ fb.classList.toggle("has",store.favs.includes(slug)); fb.innerHTML=I.heart(store.favs.includes(slug)); }
}

/* Carrousel best-sellers : défilement d'une carte par clic */
function wireCarousel(){
  const track=qs(".bs-track"); if(!track) return;
  const step=()=>{ const c=track.querySelector(".pcard"); if(!c) return 220;
    return c.getBoundingClientRect().width+(parseFloat(getComputedStyle(track).columnGap)||0); };
  const upd=()=>{ const max=track.scrollWidth-track.clientWidth-1;
    qs(".bs-prev")?.classList.toggle("dim",track.scrollLeft<=1);
    qs(".bs-next")?.classList.toggle("dim",track.scrollLeft>=max); };
  qs("[data-act='bs-prev']")?.addEventListener("click",()=>track.scrollBy({left:-step(),behavior:"smooth"}));
  qs("[data-act='bs-next']")?.addEventListener("click",()=>track.scrollBy({left:step(),behavior:"smooth"}));
  track.addEventListener("scroll",upd,{passive:true});
  window.addEventListener("resize",upd); upd();
}

function setPdpMedia(i){
  const p=bySlug(currentSlug); if(!p) return;
  const medias=[{type:"img",src:p.image}].concat(p.video?[{type:"video",src:p.video}]:[]);
  const m=medias[i]; if(!m) return;
  qs("#pdpMain").innerHTML=m.type==="video"
    ?`<video src="${m.src}" autoplay muted loop playsinline></video>`
    :`<img src="${m.src}" alt="${esc(p.name)}">`;
  qsA(".pdp-thumb").forEach((b,bi)=>b.classList.toggle("active",bi===i));
}

/* Dispatcher global des actions (délégation d'événements) */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");
  if(!e.target.closest(".nav-drop")) qs(".nav-drop.open")?.classList.remove("open");
  if(!t) return;
  const act=t.dataset.act;
  switch(act){
    case "open-cart": e.preventDefault(); openUI("cart"); break;
    case "open-favs": e.preventDefault(); openUI("favs"); break;
    case "open-menu": openUI("menu"); break;
    case "close-ui": e.preventDefault(); closeUI(); break;
    case "drop": e.preventDefault(); t.closest(".nav-drop").classList.toggle("open"); break;
    case "clear-q": location.hash="#/catalogue"; break;
    case "size":{ qsA(".size").forEach(b=>b.classList.remove("sel")); t.classList.add("sel"); pdpState.size=t.dataset.size; break; }
    case "thumb": setPdpMedia(+t.dataset.i); break;
    case "q-plus": pdpState.qty=Math.min(99,pdpState.qty+1); qs("#qVal").textContent=pdpState.qty; break;
    case "q-minus": pdpState.qty=Math.max(1,pdpState.qty-1); qs("#qVal").textContent=pdpState.qty; break;
    case "add":{ const p=bySlug(currentSlug); if(!pdpState.size){
        toast("Choisissez d'abord une taille");
        const s=qs(".pdp-sizes"); s.classList.remove("flash"); void s.offsetWidth; s.classList.add("flash");
      } else addToCart(currentSlug,pdpState.size,pdpState.qty); break; }
    case "pdp-fav": toggleFav(currentSlug); break;
    case "c-plus":{ const it=store.cart[+t.dataset.i]; if(it){ it.qty=Math.min(99,it.qty+1); persist(); renderOverlays(); updateBadges(); } break; }
    case "c-minus":{ const it=store.cart[+t.dataset.i]; if(it){ it.qty--; if(it.qty<=0) store.cart.splice(+t.dataset.i,1); persist(); renderOverlays(); updateBadges(); } break; }
    case "c-del": store.cart.splice(+t.dataset.i,1); persist(); renderOverlays(); updateBadges(); break;
    case "f-del":{ const i=store.favs.indexOf(t.dataset.slug); if(i>=0){ store.favs.splice(i,1); persist(); renderOverlays(); updateBadges(); } break; }
  }
});

function wireOverlays(){
  const si=qs("#srchInput"); if(!si) return;
  const render=q=>{
    const ql=q.trim().toLowerCase();
    const list=!ql?[]:PRODUCTS.filter(p=>p.name.toLowerCase().includes(ql)||p.category.includes(ql));
    qs("#srchRes").innerHTML=!ql?`<p class="srch-hint">Tapez pour rechercher parmi les produits — Entrée pour voir le catalogue.</p>`
      :list.length?list.map(p=>`<a class="sres" href="#/produit/${p.slug}"><span>${esc(p.name)}</span><span class="sres-price">${fmt(p.price)} FCFA</span></a>`).join("")
      :`<p class="srch-hint">Aucun résultat pour « ${esc(q)} ».</p>`;
  };
  si.addEventListener("input",()=>render(si.value));
  si.addEventListener("keydown",e=>{ if(e.key==="Enter"&&si.value.trim()) location.hash="#/catalogue?q="+encodeURIComponent(si.value.trim()); });
  setTimeout(()=>si.focus(),380);
}

function renderApp(){
  const {parts,params}=parseHash();
  const view=routeView(parts,params);
  const app=qs("#app");
  app.innerHTML=`<a class="skip" href="#main">Aller au contenu</a>${Header(parts)}<main id="main">${view.html}</main>${Footer()}<div id="overlays"></div>`;
  renderOverlays(); updateBadges(); observeReveals();
  // Recherche du header : desktop → focus le champ inline ; mobile/tablette → ouvre la recherche plein écran
  const hsWrap=qs(".hdr-search"), hs=qs("#hdrSearch");
  hsWrap?.addEventListener("click",e=>{
    if(e.target===hs) return;
    if(hs && hs.offsetParent!==null){ hs.focus(); }
    else { openUI("search"); }
  });
  hs?.addEventListener("keydown",e=>{ if(e.key==="Enter"&&hs.value.trim()) location.hash="#/catalogue?q="+encodeURIComponent(hs.value.trim()); });
  if(parts[0]!=="produit") currentSlug=null;
  if(parts[0]==="") wireCarousel();
  window.scrollTo(0,0);
  document.title=view.title==="Accueil"?"LA MAISON NOMADE — ABIDJAN":`LA MAISON NOMADE — ABIDJAN · ${view.title}`;
}

window.addEventListener("hashchange",()=>{ state.ui={}; renderApp(); });
renderApp();
</script>
</body>
</html>
